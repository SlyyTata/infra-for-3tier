name: Terraform

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch: # manual "Run workflow" button

# Only one run at a time touches the state file
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; each job asks only for what it needs
permissions: {}

jobs:
  # ------------------------------------------------------------------
  # 1. Security tests. Runs WITHOUT any AWS credentials. If any check
  #    fails, the terraform job below never starts, so nothing insecure
  #    is planned or applied.
  #
  #    Accepted findings are skipped inline in the .tf files with a
  #    written reason (#checkov:skip=... / #trivy:ignore:...), so a NEW
  #    insecure change always fails this job.
  # ------------------------------------------------------------------
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0              # full history, so the secret scan sees every commit
          persist-credentials: false  # don't leave the GitHub token on disk

      # Passwords, keys or tokens committed anywhere in the git history
      - name: Secret scan (Gitleaks)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/repo zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --verbose

      # Insecure Terraform: open security groups, public resources, weak IAM, missing encryption...
      - name: Terraform misconfiguration scan (Checkov)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/tf bridgecrew/checkov:3.4.5 \
            --directory /tf --framework terraform --compact --quiet

      # Second opinion with a different rule set; blocks on HIGH and CRITICAL
      - name: Terraform misconfiguration scan (Trivy)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/tf aquasec/trivy:0.76.2 \
            config --severity HIGH,CRITICAL --exit-code 1 /tf

      # The pipeline itself: unpinned actions, token leaks, script injection...
      - name: Workflow security scan (zizmor)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/repo ghcr.io/zizmorcore/zizmor:1.32.0 \
            --offline /repo/.github/workflows

  # ------------------------------------------------------------------
  # 2. Plan (and on main, apply). Only runs if the security scan passed.
  # ------------------------------------------------------------------
  terraform:
    name: Terraform plan / apply
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      id-token: write # needed for OIDC login to AWS
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-west-2
          role-to-assume: ${{ secrets.ROLE }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.16.6"

      # Runs before terraform.tfvars is written, so it only checks committed code
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # terraform.tfvars is git-ignored, so its full contents live in one secret
      - name: Write terraform.tfvars
        env:
          TFVARS: ${{ secrets.TFVARS }}
        run: printf '%s\n' "$TFVARS" > terraform.tfvars

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      # Pull requests stop at plan; only main (push or manual run) applies
      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan
