name: Terraform

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch: # manual "Run workflow" button

# Only one run at a time touches the state file
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; each job asks only for what it needs
permissions: {}

jobs:

  # Security scan job runs first, and must pass before terraform job runs. It uses Docker images to avoid installing tools on the runner.
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0              # full history, so the secret scan sees every commit
          persist-credentials: false  # don't leave the GitHub token on disk

      # Passwords, keys or tokens committed anywhere in the git history
      - name: Secret scan (Gitleaks)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/repo zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --verbose

      # Insecure Terraform: open security groups, public resources, weak IAM, missing encryption...
      - name: Terraform misconfiguration scan (Checkov)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/tf bridgecrew/checkov:3.4.5 \
            --directory /tf --framework terraform --compact --quiet

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # Terraform job begins here, but only if the security-scan job above passes.
  terraform:
    name: Terraform plan / apply
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      id-token: write # needed for OIDC login to AWS
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: eu-west-2
          role-to-assume: ${{ secrets.ROLE }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"

      # Runs before terraform.tfvars is written, so it only checks committed code
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # terraform.tfvars is git-ignored, so its full contents live in one secret
      - name: Write terraform.tfvars
        env:
          TFVARS: ${{ secrets.TFVARS }}
        run: printf '%s\n' "$TFVARS" > terraform.tfvars

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      # Pull requests stop at plan; only main (push or manual run) applies
      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan

  # posts an alert to the team's Slack channel
  notify-failure:
    name: Send custom event details to a Slack workflow
    needs: [security-scan, terraform]
    permissions: {}
    uses: slackapi/slack-github-action@v4.0.0
    with:
      webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
      webhook-type: webhook-trigger
      payload: |
        status: "${{ job.status }}"
        option: "false"